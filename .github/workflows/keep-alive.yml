# GitHub disables scheduled workflows after 60 days of repo inactivity.
# This tiny job runs on the 1st of each month and touches one file so
# the repo is never "silent" for long enough to trigger that rule.

name: keep-alive

on:
  schedule:
    - cron: '0 12 1 * *'    # 12:00 UTC on the 1st of every month
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Touch heartbeat file
        run: |
          mkdir -p .github
          date -u '+Last keep-alive run: %Y-%m-%d %H:%M:%S UTC' > .github/last-activity
          git config user.name  "daily-briefing-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/last-activity
          if git diff --cached --quiet; then
            echo "No timestamp change."
          else
            git commit -m "keep-alive $(date -u '+%Y-%m-%d')"
            git push
          fi
