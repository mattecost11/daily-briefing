# Daily Briefing — twice-weekly news refresh.
# Fires at 07:00 Europe/London on Monday and Thursday.
# We schedule two UTC crons (06:00 and 07:00) so we always cover
# both British Summer Time (UTC+1) and Greenwich Mean Time (UTC+0).
# A guard step then skips the extra run so real work happens exactly once.

name: refresh

on:
  schedule:
    - cron: '0 6 * * 1,4'   # 07:00 London during BST (summer)
    - cron: '0 7 * * 1,4'   # 07:00 London during GMT (winter)
  workflow_dispatch:         # allow manual triggering from the Actions tab

permissions:
  contents: write            # needed so the bot can commit news.json back

concurrency:
  group: refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Guard — only run at 07:00 London
        id: gate
        run: |
          hour=$(TZ=Europe/London date +%H)
          echo "London hour: $hour"
          if [ "$hour" != "07" ] && [ "${{ github.event_name }}" = "schedule" ]; then
            echo "Not 07:00 London, skipping this scheduled run."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Node
        if: steps.gate.outputs.skip != 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        if: steps.gate.outputs.skip != 'true'
        run: npm ci

      - name: Run refresh pipeline
        if: steps.gate.outputs.skip != 'true'
        run: npm run refresh

      - name: Summarise articles (Gemini)
        if: steps.gate.outputs.skip != 'true'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: npm run summarize

      - name: Commit updated news.json
        if: steps.gate.outputs.skip != 'true'
        id: commit
        run: |
          git config user.name  "daily-briefing-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data/news.json
          if git diff --cached --quiet; then
            echo "news.json unchanged — nothing to commit."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            stamp="$(TZ=Europe/London date '+%Y-%m-%d %H:%M %Z')"
            git commit -m "Refresh news ($stamp)"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Send push notification
        if: steps.gate.outputs.skip != 'true' && steps.commit.outputs.changed == 'true'
        env:
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          PUSH_SUBSCRIPTION: ${{ secrets.PUSH_SUBSCRIPTION }}
        run: npm run push
