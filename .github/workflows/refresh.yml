# Daily Briefing — twice-weekly news refresh (Monday and Thursday, from 07:00 London).
#
# GitHub's free scheduler often starts cron jobs hours late (4–6 h observed),
# so we can't rely on a run landing at an exact hour. Instead:
#   - several crons fire through the day on Mon/Thu, off the top of the hour
#     (the top of the hour is GitHub's busiest, most-delayed slot);
#   - the guard lets the FIRST run that starts on or after 07:00 London do the
#     refresh, and every later run that day sees "already refreshed" and stops.
# Result: exactly one refresh + one notification per Mon/Thu, as early as
# GitHub allows.

name: refresh

on:
  schedule:
    - cron: '17 6 * * 1,4'
    - cron: '17 7 * * 1,4'
    - cron: '17 9 * * 1,4'
    - cron: '17 12 * * 1,4'
    - cron: '17 16 * * 1,4'
  workflow_dispatch:         # manual trigger from the Actions tab — always refreshes

permissions:
  contents: write            # needed so the bot can commit news.json back

concurrency:
  group: refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Guard — once per Mon/Thu, from 07:00 London
        id: gate
        run: |
          if [ "${{ github.event_name }}" != "schedule" ]; then
            echo "Manual run — refreshing unconditionally."
            echo "skip=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          dow=$(TZ=Europe/London date +%u)       # 1 = Monday … 7 = Sunday
          hour=$(TZ=Europe/London date +%H)
          today=$(TZ=Europe/London date +%F)
          gen=$(jq -r '.generated_at // empty' docs/data/news.json)
          last=""
          if [ -n "$gen" ]; then last=$(TZ=Europe/London date -d "$gen" +%F); fi
          echo "London: weekday=$dow hour=$hour today=$today last-refresh=$last"
          reason=""
          if [ "$dow" != "1" ] && [ "$dow" != "4" ]; then
            reason="not Monday or Thursday in London"
          elif [ "$((10#$hour))" -lt 7 ]; then
            reason="before 07:00 London"
          elif [ "$last" = "$today" ]; then
            reason="already refreshed today"
          fi
          if [ -n "$reason" ]; then
            echo "Skipping: $reason."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "Refreshing now."
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Node
        if: steps.gate.outputs.skip != 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        if: steps.gate.outputs.skip != 'true'
        run: npm ci

      - name: Run refresh pipeline
        if: steps.gate.outputs.skip != 'true'
        run: npm run refresh

      - name: Summarise articles (Gemini)
        if: steps.gate.outputs.skip != 'true'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: npm run summarize

      - name: Commit updated news.json
        if: steps.gate.outputs.skip != 'true'
        id: commit
        run: |
          git config user.name  "daily-briefing-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data/news.json
          if git diff --cached --quiet; then
            echo "news.json unchanged — nothing to commit."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            stamp="$(TZ=Europe/London date '+%Y-%m-%d %H:%M %Z')"
            git commit -m "Refresh news ($stamp)"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Send push notification
        if: steps.gate.outputs.skip != 'true' && steps.commit.outputs.changed == 'true'
        env:
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          PUSH_SUBSCRIPTION: ${{ secrets.PUSH_SUBSCRIPTION }}
        run: npm run push
